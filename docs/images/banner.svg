<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#151a2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ffc35c"/>
    </linearGradient>
    <linearGradient id="badgeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.1" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="360" fill="url(#gridFade)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="badgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff7a2f" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1280" height="360" fill="url(#glowL)"/>
    <rect width="1280" height="360" fill="url(#glowR)"/>
    <rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>

  <!-- logo mark: a dart with speed lines -->
  <g transform="translate(64 56)" filter="url(#badgeGlow)">
    <rect width="112" height="112" rx="28" fill="url(#accent)"/>
    <rect width="112" height="112" rx="28" fill="url(#badgeShine)"/>
    <path d="M54 34 L90 56 L54 78 L64 56 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <path d="M30 44 H45" stroke-opacity="0.75"/>
      <path d="M22 56 H50"/>
      <path d="M30 68 H45" stroke-opacity="0.75"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="200" y="141" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Courier</text>
    <text x="64" y="214" font-size="26" fill="#d6dde6">A Postman-style API client inside Unreal Engine 5</text>
    <text x="64" y="248" font-size="18" fill="#8b949e">Editor window · Blueprint nodes · async delegates · Postman import/export</text>

    <!-- protocol pills: text centred on both axes -->
    <g font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <rect x="64"  y="276" width="68"  height="30" rx="15" fill="#13301d"/><text x="98"  y="291" fill="#7ee787">HTTP</text>
      <rect x="142" y="276" width="96"  height="30" rx="15" fill="#2d1736"/><text x="190" y="291" fill="#f0a0e0">GraphQL</text>
      <rect x="248" y="276" width="114" height="30" rx="15" fill="#11283a"/><text x="305" y="291" fill="#79c0ff">WebSocket</text>
      <rect x="372" y="276" width="110" height="30" rx="15" fill="#0f2e2c"/><text x="427" y="291" fill="#56d4c0">Socket.IO</text>
      <rect x="492" y="276" width="60"  height="30" rx="15" fill="#3a2a14"/><text x="522" y="291" fill="#ffbd59">SSE</text>
      <rect x="562" y="276" width="110" height="30" rx="15" fill="#221d3d"/><text x="617" y="291" fill="#b4a0ff">OAuth 2.0</text>
      <rect x="682" y="276" width="84"  height="30" rx="15" fill="#1c2233" stroke="#2c3550"/><text x="724" y="291" fill="#c9d1d9">UE 5.5</text>
    </g>
  </g>

  <!-- request / response card -->
  <g transform="translate(848 56)" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">
    <g filter="url(#shadow)">
      <rect width="368" height="248" rx="14" fill="#1a2031" stroke="#2c3550"/>
    </g>
    <path d="M0 14 A14 14 0 0 1 14 0 H354 A14 14 0 0 1 368 14 V34 H0 Z" fill="#202840"/>
    <line x1="0" y1="34" x2="368" y2="34" stroke="#2c3550"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5" fill="#28c840"/>
    <text x="184" y="17" fill="#8b949e" font-size="13" text-anchor="middle" dominant-baseline="central">Courier</text>

    <rect x="18" y="50" width="62" height="26" rx="6" fill="#3a2a14"/>
    <text x="49" y="63" fill="#ffbd59" font-weight="700" text-anchor="middle" dominant-baseline="central">POST</text>
    <text x="92" y="63" fill="#c9d1d9" dominant-baseline="central">{{base}}/scores</text>
    <rect x="290" y="50" width="60" height="26" rx="6" fill="url(#accent)"/>
    <text x="320" y="63" fill="#1a1206" font-weight="700" font-size="13" text-anchor="middle" dominant-baseline="central">Send</text>

    <line x1="18" y1="92" x2="350" y2="92" stroke="#2c3550"/>

    <rect x="18" y="106" width="76" height="24" rx="12" fill="#13301d"/>
    <text x="56" y="118" fill="#7ee787" font-weight="700" font-size="14" text-anchor="middle" dominant-baseline="central">200 OK</text>
    <text x="106" y="118" fill="#8b949e" font-size="14" dominant-baseline="central">142 ms · 0.6 KB</text>
    <text x="18" y="156" fill="#8b949e">{</text>
    <text x="36" y="180" fill="#79c0ff">"player"<tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Ada"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="36" y="204" fill="#79c0ff">"goals"<tspan fill="#8b949e">: </tspan><tspan fill="#ffbd59">3</tspan></text>
    <text x="18" y="228" fill="#8b949e">}</text>
  </g>
</svg>
