<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffbd59"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>

  <!-- request / response motif -->
  <g transform="translate(860 70)" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">
    <rect width="340" height="220" rx="12" fill="#1c2233" stroke="#2c3550"/>
    <rect x="18" y="20" width="58" height="24" rx="5" fill="#3a2a14"/>
    <text x="27" y="37" fill="#ffbd59" font-weight="700">POST</text>
    <text x="88" y="37" fill="#c9d1d9">{{base}}/scores</text>
    <line x1="18" y1="62" x2="322" y2="62" stroke="#2c3550"/>
    <text x="18" y="90" fill="#7ee787" font-weight="700">200 OK</text>
    <text x="96" y="90" fill="#8b949e">142 ms · 0.6 KB</text>
    <text x="18" y="122" fill="#8b949e">{</text>
    <text x="34" y="146" fill="#79c0ff">"player"<tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Ada"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="34" y="170" fill="#79c0ff">"goals"<tspan fill="#8b949e">: </tspan><tspan fill="#ffbd59">3</tspan></text>
    <text x="18" y="194" fill="#8b949e">}</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700">
    <rect x="1080" y="300" width="58" height="26" rx="13" fill="#11283a"/><text x="1097" y="318" fill="#79c0ff">WS</text>
    <rect x="1146" y="300" width="58" height="26" rx="13" fill="#2d1736"/><text x="1160" y="318" fill="#f0a0e0">SSE</text>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <path d="M72 108 l40 22 l-40 22 z" fill="url(#accent)"/>
    <path d="M60 116 h18 M54 130 h22 M60 144 h18" stroke="#ff8a3d" stroke-width="5" stroke-linecap="round"/>
    <text x="130" y="152" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">Courier</text>
    <text x="64" y="206" font-size="26" fill="#c9d1d9">A Postman-style API client inside Unreal Engine 5</text>
    <text x="64" y="242" font-size="18" fill="#8b949e">Editor window · Blueprint nodes · async delegates · Postman import/export</text>
    <g font-size="15" font-weight="700">
      <rect x="64" y="272" width="72" height="30" rx="15" fill="#13301d"/><text x="82" y="292" fill="#7ee787">HTTP</text>
      <rect x="146" y="272" width="96" height="30" rx="15" fill="#2d1736"/><text x="163" y="292" fill="#f0a0e0">GraphQL</text>
      <rect x="252" y="272" width="112" height="30" rx="15" fill="#11283a"/><text x="268" y="292" fill="#79c0ff">WebSocket</text>
      <rect x="374" y="272" width="62" height="30" rx="15" fill="#3a2a14"/><text x="391" y="292" fill="#ffbd59">SSE</text>
      <rect x="446" y="272" width="94" height="30" rx="15" fill="#1c2233" stroke="#2c3550"/><text x="462" y="292" fill="#c9d1d9">UE 5.5</text>
    </g>
  </g>
</svg>
